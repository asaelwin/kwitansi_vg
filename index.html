<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kwitansi VG">
<meta name="format-detection" content="telephone=no">
<title>Kwitansi Victory Garage</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root {
  --bg: #f2f2f4; --card: #ffffff; --ink: #16181d; --ink-2: #5a606b; --line: #e2e3e8;
  --accent: #c8102e; --accent-ink: #ffffff; --accent-soft: #fdecee; --bar: #17181b; --bar-ink: #f4f4f5;
  --warn-bg: #fff6e0; --warn: #8a5a00; --ok: #1d7a45; --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bar); color: var(--bar-ink);
}
.topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.bar-logo { height: 30px; width: auto; background: #f3f3f3; border-radius: 6px; padding: 2px 4px; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(255,255,255,.08); color: inherit; cursor: pointer; }
.icon-btn.plain { background: transparent; color: var(--ink-2); }

main { padding: 14px 16px 24px; display: grid; gap: 14px; }

/* Cards and fields */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); display: grid; gap: 12px; }
.card h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.input {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 11px;
  background: #fff; color: var(--ink); font: 16px var(--font); outline: none; -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--accent); background: var(--accent-soft); }
textarea.input { min-height: 84px; resize: vertical; }
input[type="date"].input { min-height: 46px; min-width: 0; max-width: 100%; display: block; line-height: 24px; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
.money-wrap { position: relative; }
.money-wrap .prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-weight: 600; pointer-events: none; }
.money-wrap .input { padding-left: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--ink-2); margin: 0; }
.hint.warn { color: var(--warn); }
.hint.warn:empty { display: none; }
.hint.center { text-align: center; }
.error { font-size: 13px; color: var(--accent); font-weight: 600; }
.error:empty { display: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.calc { display: block; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; padding: 2px 0; }
.terbilang { font-style: italic; font-weight: 600; background: #f0f0f0; border-radius: 9px; padding: 8px 10px; min-height: 38px; }
.terbilang:empty::before { content: "–"; color: var(--ink-2); font-style: normal; }

/* Switches */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch-row label { display: grid; font-weight: 600; }
.switch-row small { font-weight: 400; color: var(--ink-2); font-size: 13px; }
.switch { position: relative; flex: none; width: 52px; height: 32px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: #c9cbd1; border-radius: 99px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px;
  border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font-weight: 650; cursor: pointer; text-decoration: none;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: #b3261e; border-color: #b3261e; color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn.grow, .grow { flex: 1; min-width: 0; }
.danger-text { color: #b3261e; }
.btn:active { transform: translateY(1px); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.actions { display: flex; gap: 10px; }
.actions.stack { flex-direction: column; }
.actions.sticky {
  position: sticky; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 5;
  background: linear-gradient(to top, var(--bg) 70%, rgba(242,242,244,0)); padding: 14px 0 4px; margin-top: -6px;
}

/* Banners */
.banner { display: flex; gap: 10px; align-items: center; background: #e9edf7; border-radius: var(--radius); padding: 12px 14px; }
.banner > svg { flex: none; }
.banner .grow { display: grid; gap: 2px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.banner.soft { background: #f4f4f6; }
.banner.install { background: #fff; border: 1.5px dashed #c9ccd4; }

/* Receipt preview */
.paper-box { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); overflow: hidden; cursor: zoom-in; line-height: 0; }
.paper { display: block; width: 100%; height: auto; }
.zoom { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,22,.94); display: flex; flex-direction: column; }
.zoom-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 2; color: #fff; background: rgba(255,255,255,.15); }
.zoom-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: calc(60px + env(safe-area-inset-top)) 12px 24px; }
.zoom-paper { display: block; background: #fff; height: auto; }

/* History */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.search .input { padding-left: 42px; }
.list { display: grid; gap: 10px; }
.item { display: grid; gap: 3px; text-align: left; width: 100%; background: var(--card); border: 0; border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); cursor: pointer; }
.item-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.item-top strong { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-sub { color: var(--ink-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #eceef2; color: var(--ink-2); white-space: nowrap; }
.badge.red { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 40px 0; display: grid; gap: 12px; justify-items: center; color: var(--ink-2); }

/* Settings */
.sig-preview { background: #fff; border: 1.5px dashed #c9ccd4; border-radius: 12px; min-height: 110px; display: grid; place-items: center; padding: 10px; }
.sig-preview img { max-width: 100%; max-height: 120px; }
.stamp-preview { width: 220px; max-width: 70%; justify-self: center; }
.logo-preview { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: grid; place-items: center; }
.logo-preview img { max-width: 100%; max-height: 90px; }
.seg { display: inline-flex; background: #eceef2; border-radius: 12px; padding: 3px; gap: 3px; justify-self: start; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; cursor: pointer; }
.seg-btn.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Signature pad */
.pad-sheet { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); }
.pad-head { display: grid; gap: 2px; }
.pad-area { position: relative; flex: 1; min-height: 180px; background: #fff; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad-line { position: absolute; left: 8%; right: 8%; bottom: 26%; border-bottom: 1.5px dashed #b9bcc5; pointer-events: none; }

/* Bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.tab { flex: 1; max-width: 186px; display: grid; justify-items: center; gap: 2px; min-height: 54px; border: 0; background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 12px; }
.tab.active { color: var(--accent); }

/* Dialogs and toasts */
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: grid; place-items: end center; padding: 16px; }
.dialog { width: 100%; max-width: 440px; background: #fff; border-radius: 18px; padding: 20px; display: grid; gap: 10px; margin-bottom: env(safe-area-inset-bottom); }
.dialog h2 { margin: 0; font-size: 18px; }
.dialog p { margin: 0; color: var(--ink-2); }
#toast { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 80; display: grid; justify-items: center; pointer-events: none; padding: 0 16px; }
.toast { display: flex; align-items: center; gap: 8px; max-width: 520px; background: #1d1f24; color: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 15px; pointer-events: auto; }
.toast svg { color: #7ee2a8; flex: none; }
.toast.error { background: #8c1d18; }
.toast.error svg { color: #ffd2cc; }

@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
@media (min-width: 600px) { body { background: #e7e7ea; } #app { background: var(--bg); box-shadow: 0 0 0 1px var(--line); } }
</style>
</head>

  var BULAN_PENDEK = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
  var ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

        settings.logoId !== 'builtin' ? h('button', { class: 'btn ghost', onclick: function () { saveSettings({ logoId: 'builtin' }, 'Kembali ke logo bawaan.'); } }, 'Pakai logo bawaan') : null, logoPick)));

    // Numbering
    var y = F.isoToday().slice(0, 4), next = ST.nextNumber(settings, receipts, F.isoToday());
    main.appendChild(h('section', { class: 'card' }, h('h2', { text: 'Nomor kwitansi' }),
      field('s-pattern', 'Format', textInput('s-pattern', settings.numberPattern, function () {}), 'Kode: {NNN} nomor urut, {ROM} bulan Romawi, {MM} bulan, {YYYY} tahun. Contoh: {NNN}/VG/{ROM}/{YYYY}'),
      field('s-next', 'Nomor urut berikutnya (' + y + ')', textInput('s-next', String(next.seq), function () {}, { inputmode: 'numeric' })),
      h('p', { class: 'hint', id: 's-next-preview', text: 'Kwitansi berikutnya: ' + next.no }),
      h('button', { class: 'btn', id: 'save-numbering', onclick: function () {
        var pat = document.getElementById('s-pattern').value.trim() || '{NNN}/VG/{ROM}/{YYYY}';
        if (!/\{N+\}/.test(pat)) { setError('s-pattern', 'Format harus berisi {NNN}.'); return; }
        var n = parseInt(document.getElementById('s-next').value, 10);
        if (!(n >= 1)) { setError('s-next', 'Isi angka 1 atau lebih.'); return; }
        var used = 0; receipts.forEach(function (r) { if (String(r.date).slice(0, 4) === y && r.seq > used) used = r.seq; });
        if (n <= used) { setError('s-next', 'Nomor ' + used + ' sudah dipakai tahun ini. Isi ' + (used + 1) + ' atau lebih.'); return; }
        var counters = Object.assign({}, settings.counters); counters[y] = n - 1;
        saveSettings({ numberPattern: pat, counters: counters }, 'Nomor kwitansi disimpan.');
        if (draft && !draft.id && !draft.noEdited) { var nn = ST.nextNumber(settings, receipts, draft.date); draft.no = nn.no; draft.seq = nn.seq; store.saveDraft(draft); }
      } }, 'Simpan nomor')));

    // Data
    var restorePick = filePicker('.json,application/json', async function (file) {
      try {
        var text = await file.text();
        var replace = await ask('Pulihkan cadangan', 'Tambahkan kwitansi dari file ke data yang ada? (Pilih Batal untuk tidak memulihkan.)', 'Tambahkan');
        if (!replace) return;
        var r = store.restore(text, 'merge');
        settings = store.settings(); receipts = store.receipts(); render();
        toast(r.added + ' kwitansi dipulihkan. Total ' + r.total + '.');
      } catch (e) { toast(e.message, 'error'); }
    });
    main.appendChild(h('section', { class: 'card' }, h('h2', { text: 'Data & cadangan' }),
      h('p', { class: 'hint', text: receipts.length + ' kwitansi tersimpan di HP ini. Data tidak dikirim ke mana pun. Menghapus aplikasi atau data browser akan menghapusnya, jadi buat cadangan secara berkala.' + (settings.lastBackupAt ? ' Cadangan terakhir: ' + F.tanggal(String(settings.lastBackupAt).slice(0, 10)) + '.' : '') }),
      h('div', { class: 'row wrap' },
        h('button', { class: 'btn', id: 'backup', onclick: async function () {
          var name = 'cadangan-kwitansi-vg-' + F.isoToday() + '.json', blob = new Blob([store.backup()], { type: 'application/json' });
          var file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e && e.name === 'AbortError') return; downloadBlob(blob, name); } }
          else downloadBlob(blob, name);
          saveSettings({ lastBackupAt: new Date().toISOString() }, 'Cadangan dibuat.');
        } }, icon('download'), 'Buat cadangan'),
        h('button', { class: 'btn', onclick: function () { restorePick.click(); } }, 'Pulihkan', restorePick)),
      h('button', { class: 'btn ghost danger-text', id: 'delete-all', onclick: async function () {
        if (!(await ask('Hapus semua data?', 'Semua kwitansi, tanda tangan, logo dan pengaturan di HP ini akan dihapus.', 'Lanjut', true))) return;
        if (!(await ask('Yakin?', 'Ini tidak bisa dibatalkan. Sudah buat cadangan?', 'Hapus semua', true))) return;
        store.clearAll(); settings = store.settings(); receipts = []; draft = emptyDraft(); ui.view = 'form'; render(); toast('Semua data dihapus.');
      } }, icon('trash'), 'Hapus semua data')));

    main.appendChild(h('p', { class: 'hint center', text: 'Kwitansi VG ' + VERSION + (env.standalone ? ' · terpasang di HP' : '') }));
  }

  // ---------------------------------------------------------------------------
  // Signature pad (full screen)
  // ---------------------------------------------------------------------------
  function openSigPad() {
    var root = document.getElementById('modal');
    var canvas = h('canvas', { class: 'pad', id: 'sig-pad', 'aria-label': 'Area tanda tangan' });
    var pad;
    var sheet = h('div', { class: 'pad-sheet', role: 'dialog', 'aria-label': 'Gambar tanda tangan' },
      h('div', { class: 'pad-head' }, h('strong', { text: 'Tanda tangan di kotak putih' }), h('span', { class: 'hint', text: 'Miringkan HP agar lebih lebar.' })),
      h('div', { class: 'pad-area' }, canvas, h('div', { class: 'pad-line' })),
      h('div', { class: 'row' },
        h('button', { class: 'btn ghost', onclick: function () { root.textContent = ''; window.removeEventListener('resize', onResize); } }, 'Batal'),
        h('button', { class: 'btn ghost', id: 'pad-clear', onclick: function () { pad.clear(); } }, 'Ulangi'),
        h('button', { class: 'btn primary grow', id: 'pad-save', onclick: function () {
          if (pad.isEmpty()) { toast('Belum ada tanda tangan.', 'error'); return; }
          var img = pad.toImage();
          if (!img) { toast('Belum ada tanda tangan.', 'error'); return; }
          root.textContent = ''; window.removeEventListener('resize', onResize);
          saveSettings({ sigId: store.putAsset(img.dataUrl, { w: img.w, h: img.h, kind: 'sig' }) }, 'Tanda tangan disimpan.');
        } }, icon('check'), 'Simpan')));
    root.appendChild(sheet);
    pad = new SIG.Pad(canvas, { color: settings.sigColor });
    function onResize() { pad.resize(); }
    window.addEventListener('resize', onResize);
  }

  // ---------------------------------------------------------------------------
  // "Add to Home Screen"
  // ---------------------------------------------------------------------------
  function installCard() {
    var steps = env.ios
      ? 'Di Safari: ketuk tombol Bagikan (kotak dengan panah ke atas), lalu "Tambah ke Layar Utama".'
      : 'Di Chrome: ketuk menu ⋮ lalu "Instal aplikasi" atau "Tambahkan ke layar utama".';
    return h('div', { class: 'banner install' }, icon('download'),
      h('div', { class: 'grow' }, h('strong', { text: 'Pasang di layar utama HP' }), h('span', { text: steps })),
      ui.installPrompt ? h('button', { class: 'btn small primary', onclick: async function () { ui.installPrompt.prompt(); ui.installPrompt = null; } }, 'Pasang') : null,
      h('button', { class: 'icon-btn plain', 'aria-label': 'Tutup', onclick: function () { saveSettings({ installHintDismissed: true }); } }, icon('close')));
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ui.installPrompt = e; if (ui.view === 'form') render(); });

  // ---------------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------------
  draft = store.draft() || emptyDraft();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(function () {});
  window.__kwitansi = { store: store, state: function () { return { settings: settings, receipts: receipts, draft: draft, ui: ui }; }, makePdf: makePdf, version: VERSION };
})();

</script>
</body>
</html>
